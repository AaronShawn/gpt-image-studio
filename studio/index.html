<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPT Image Studio</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --ink:#18181b; --ink-2:#52525b; --ink-3:#8b8b93;
    --line:#e6e6e9; --line-2:#f0f0f2; --accent:#2f5cff; --accent-soft:#eef2ff;
    --ok:#0f9d58; --warn:#b45309; --err:#d93025; --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  header{
    height:56px; display:flex; align-items:center; gap:12px; padding:0 18px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#2f5cff,#7c3aed);
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;letter-spacing:-.5px}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .chip{font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .chip b{font-weight:600;color:var(--ink)}
  select.chip{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:24px;flex:0 0 auto;max-width:230px;
    background-image:linear-gradient(45deg,transparent 50%,#8b8b93 50%),linear-gradient(135deg,#8b8b93 50%,transparent 50%);
    background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  select.chip:hover{border-color:#d4d4d8;color:var(--ink)}
  .grow{flex:1}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
  .ghost:hover{border-color:#d4d4d8;color:var(--ink)}

  main{display:grid;grid-template-columns:392px minmax(0,1fr);gap:16px;padding:16px;align-items:start;
    max-width:1560px;margin:0 auto}
  @media (max-width:1080px){ main{grid-template-columns:1fr} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card > .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .card > .hd h2{font-size:13px;margin:0;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
  .pad{padding:14px}

  .tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:8px;font-size:13px;color:var(--ink-2)}
  .tabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

  label.f{display:block;font-size:12px;color:var(--ink-3);margin:12px 0 6px;letter-spacing:.02em}
  label.f:first-child{margin-top:0}
  textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;background:#fcfcfd;outline:none;line-height:1.6}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;background:#fcfcfd;outline:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  .drop{border:1.5px dashed #dcdce1;border-radius:10px;background:#fcfcfd;padding:14px;text-align:center;
    color:var(--ink-3);font-size:12.5px;transition:.15s}
  .drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .refs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .ref{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;aspect-ratio:1}
  .ref img{width:100%;height:100%;object-fit:cover;display:block}
  .ref button{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:0;
    background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}

  .primary{width:100%;margin-top:16px;border:0;border-radius:10px;padding:11px 0;font-size:14px;font-weight:600;
    color:#fff;background:linear-gradient(180deg,#3a63ff,#2f5cff);box-shadow:0 6px 16px -8px rgba(47,92,255,.8)}
  .primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
  .primary:not(:disabled):hover{filter:brightness(1.05)}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}

  .stage{min-height:520px;display:flex;flex-direction:column}
  .canvas{flex:1;display:grid;place-items:center;padding:18px;min-height:440px;position:relative}
  .canvas img{max-width:100%;max-height:min(72vh,760px);border-radius:10px;
    box-shadow:0 12px 40px -18px rgba(16,24,40,.35);background:
      conic-gradient(#f1f1f4 25%,#fff 0 50%,#f1f1f4 0 75%,#fff 0) 0 0/16px 16px}
  .empty{color:var(--ink-3);font-size:13px;text-align:center;line-height:2}
  .empty kbd{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);
    animation:spin .9s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meta{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
  .meta .k{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  .meta .k b{color:var(--ink);font-weight:600}
  .actions{margin-left:auto;display:flex;gap:8px}
  .actions a,.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;
    font-size:12px;color:var(--ink-2);text-decoration:none}
  .actions a:hover,.actions button:hover{border-color:#d4d4d8;color:var(--ink)}

  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:12px 14px}
  .thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#f4f4f6;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb:hover{border-color:var(--accent)}
  .thumb .del{position:absolute;inset:auto 4px 4px auto;background:rgba(0,0,0,.5);color:#fff;border:0;
    border-radius:6px;font-size:10px;padding:2px 6px;opacity:0;transition:.15s}
  .thumb:hover .del{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(24,24,27,.35);display:none;place-items:center;z-index:50;padding:20px}
  .modal.on{display:grid}
  .modal .box{background:#fff;border-radius:14px;width:min(460px,100%);box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
  .modal .box h3{margin:0;padding:16px 18px;font-size:14px;border-bottom:1px solid var(--line-2)}
  .modal .box .bd{padding:16px 18px}
  .modal .box .ft{padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end}
  .modal .box .ft button{border:0;border-radius:9px;padding:8px 16px;font-size:13px}
  .modal .box .ft .ok{background:var(--accent);color:#fff;font-weight:600}
  .modal .box .ft .no{background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:9px;padding:9px 11px;
    font-size:12px;margin-top:12px;word-break:break-all;display:none}
  .badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink-3)}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">G2</div>
  <h1>GPT Image Studio</h1>
  <select class="chip" id="modelSel" title="切换模型（一把 Auto Key 可切多个模型）"></select>
  <span class="chip" id="gateway">网关 …</span>
  <div class="grow"></div>
  <button class="ghost" id="btnFolder">打开输出目录</button>
  <button class="ghost" id="btnSettings">设置</button>
</header>

<main>
  <section class="card">
    <div class="pad">
      <div class="tabs">
        <button data-mode="generate" class="on">文生图</button>
        <button data-mode="edit">参考图编辑</button>
      </div>

      <label class="f">提示词</label>
      <textarea id="prompt" placeholder="主体 + 场景 + 材质 + 光线 + 构图/比例。需要画面出现文字时用引号写清内容和位置。"></textarea>

      <div id="refWrap" style="display:none">
        <label class="f">参考图（可多张，最多 16 张）</label>
        <div class="drop" id="drop">拖拽图片到这里，或 <u>点击选择</u>，也可直接 Ctrl+V 粘贴
          <input type="file" id="file" accept="image/*" multiple hidden />
        </div>
        <div class="refs" id="refs"></div>
        <label class="f">保真度 input_fidelity</label>
        <select id="fidelity">
          <option value="high" selected>high —— 尽量贴近参考图</option>
          <option value="low">low —— 允许更多自由发挥</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label class="f">尺寸</label>
          <select id="size">
            <option value="auto" selected>auto（模型按提示词自选比例）</option>
            <option value="1024x1024">1:1 方形</option>
            <option value="1920x1080">16:9 横屏</option>
            <option value="1080x1920">9:16 竖屏</option>
            <option value="1536x1024">3:2 横向</option>
            <option value="1024x1536">2:3 纵向</option>
            <option value="1024x768">4:3 横向</option>
            <option value="1080x1440">3:4 纵向</option>
            <option value="2560x1080">21:9 超宽</option>
            <option value="3840x2160">3840×2160（4K 分组专用）</option>
            <option value="custom">自定义宽高…</option>
          </select>
          <div id="customSize" style="display:none;margin-top:8px">
            <div class="row">
              <input type="number" id="cw" placeholder="宽" min="256" max="4096" step="16" value="1280" />
              <input type="number" id="ch" placeholder="高" min="256" max="4096" step="16" value="720" />
            </div>
          </div>
        </div>
        <div>
          <label class="f">质量</label>
          <select id="quality">
            <option value="low">low 快/便宜</option>
            <option value="medium">medium 均衡</option>
            <option value="high" selected>high 精修</option>
            <option value="auto">auto</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label class="f">背景</label>
          <select id="background">
            <option value="">默认（不传）</option>
            <option value="opaque">opaque 不透明</option>
            <option value="transparent">transparent 透明 PNG</option>
          </select>
        </div>
        <div>
          <label class="f">返回格式</label>
          <select id="response_format">
            <option value="b64_json" selected>b64_json（推荐）</option>
            <option value="url">url</option>
          </select>
        </div>
      </div>

      <script>document.getElementById("size").addEventListener("change", function(){
        document.getElementById("customSize").style.display = this.value === "custom" ? "block" : "none";
      });</script>
      <button class="primary" id="run">生成 <span style="opacity:.7;font-weight:400">Ctrl+Enter</span></button>
      <div class="hint">尺寸只决定比例，实际像素由模型决定（多数实现会量化到固定档位，常见约 1.5MP）。单次通常 20–45s，编辑更久；一次出 1 张。</div>
      <div class="err" id="err"></div>
    </div>
  </section>

  <section class="card stage">
    <div class="canvas" id="canvas">
      <div class="empty">还没有结果<br /><kbd>写提示词</kbd> → <kbd>Ctrl+Enter</kbd></div>
    </div>
    <div class="meta" id="meta" style="display:none"></div>
    <div class="hd" style="border-bottom:0;border-top:1px solid var(--line-2)">
      <h2>历史（最近 60 张）</h2><span class="badge" id="histCount">0</span>
      <div class="grow"></div>
      <span style="font-size:12px;color:var(--ink-3)">点击缩略图载入大图</span>
    </div>
    <div class="hist" id="hist"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h3>接口设置</h3>
    <div class="bd">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="ghost" id="presetOpenai" style="padding:5px 12px;font-size:12px">用 OpenAI 官方</button>
        <button class="ghost" id="presetCustom" style="padding:5px 12px;font-size:12px">填第三方中转</button>
      </div>
      <label class="f">接口地址 base_url</label>
      <input type="text" id="cfgBase" placeholder="https://api.openai.com/v1" />
      <label class="f">模型名 model</label>
      <input type="text" id="cfgModel" list="modelList" placeholder="gpt-image-2.5-flare" autocomplete="off" />
      <datalist id="modelList"></datalist>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <button class="ghost" id="pullModels" style="padding:4px 10px;font-size:12px">拉取模型列表</button>
        <span id="modelHint" style="font-size:11.5px;color:var(--ink-3)">填好地址和 Key 后点一下，从列表里选</span>
      </div>
      <label class="f">API Key</label>
      <input type="password" id="cfgKey" placeholder="留空表示不修改当前 Key" />
      <div class="hint">Key 只写进本机 <code>config.json</code>，仅服务端读取，不出现在页面或源码里。<br />第三方中转：把对方给的 base_url 和模型名填上即可，协议与官方一致。</div>
    </div>
    <div class="ft"><button class="no" id="cfgCancel">取消</button><button class="ok" id="cfgSave">保存</button></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { mode: "generate", refs: [], current: null, busy: false, t0: 0 };

/* ---------- 模型切换 ---------- */
async function refreshModelList(current){
  const sel = $("#modelSel");
  const opts = [current];
  try{
    const r = await fetch("/api/models", { method: "POST", headers: {"Content-Type": "application/json"}, body: "{}" }).then(x => x.json());
    if(r.ok) (r.models || []).forEach(m => { if(!opts.includes(m)) opts.push(m); });
  }catch(e){}
  sel.innerHTML = opts.map(m => `<option value="${m}">模型 ${m}</option>`).join("");
  sel.value = current;
}
$("#modelSel").onchange = async () => {
  const m = $("#modelSel").value;
  await fetch("/api/config", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ model: m }) });
  $("#cfgModel").value = m;
};

/* ---------- 设置 ---------- */
async function loadConfig(){
  const r = await fetch("/api/config").then(r=>r.json());
  $("#gateway").innerHTML = "网关 <b>" + r.base_url.replace(/^https?:\/\//,"") + "</b>";
  await refreshModelList(r.model);
  $("#cfgBase").value = r.base_url;
  $("#cfgModel").value = r.model;
  $("#cfgKey").placeholder = r.has_key ? ("当前：" + r.key_masked) : "粘贴你的 API Key";
  if(!r.has_key){
    showErr("还没有配置 API Key —— 在下面的设置里填一下就能开始。");
    $("#modal").classList.add("on");
  }
}
$("#presetOpenai").onclick = () => {
  $("#cfgBase").value = "https://api.openai.com/v1";
  $("#cfgModel").value = "gpt-image-2.5-flare";
};
$("#presetCustom").onclick = () => { $("#cfgBase").value = ""; $("#cfgBase").focus(); };
$("#pullModels").onclick = async () => {
  const hint = $("#modelHint");
  hint.textContent = "查询中…";
  try{
    const r = await fetch("/api/models", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ base_url: $("#cfgBase").value.trim(), api_key: $("#cfgKey").value.trim() })
    }).then(r => r.json());
    if(!r.ok){
      const msg = String(r.error || "未知错误");
      hint.textContent = msg.indexOf("network") >= 0 ? "连不上这个地址，检查 base_url 是否写全 /v1" : "失败：" + msg;
      return;
    }
    const ids = r.models || [];
    $("#modelList").innerHTML = ids.map(m => `<option value="${m}">`).join("");
    hint.textContent = ids.length ? ("找到 " + ids.length + " 个：" + ids.slice(0,3).join(" / ") + (ids.length>3?" …":"")) : "这个地址没返回任何模型";
    if(ids.length === 1 && !$("#cfgModel").value.trim()) $("#cfgModel").value = ids[0];
  }catch(e){ hint.textContent = "请求异常：" + e.message; }
};
$("#btnSettings").onclick = () => $("#modal").classList.add("on");
$("#cfgCancel").onclick = () => $("#modal").classList.remove("on");
$("#cfgSave").onclick = async () => {
  const body = {
    base_url: $("#cfgBase").value.trim(),
    model: $("#cfgModel").value.trim(),
    api_key: $("#cfgKey").value.trim(),
  };
  await fetch("/api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)}).then(r=>r.json());
  $("#modal").classList.remove("on"); $("#cfgKey").value = ""; hideErr(); await loadConfig();
};

/* ---------- 模式 ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); state.mode = b.dataset.mode;
    $("#refWrap").style.display = state.mode === "edit" ? "block" : "none";
    $("#run").firstChild.textContent = state.mode === "edit" ? "编辑 " : "生成 ";
    syncPlaceholder();
  };
});
function syncPlaceholder(){
  $("#prompt").placeholder = state.mode === "edit"
    ? "描述要改什么、保留什么。例：把杯子换成亮黄色陶瓷杯，保留桌面光影和构图。"
    : "主体 + 场景 + 材质 + 光线 + 构图/比例。需要画面出现文字时用引号写清内容和位置。";
}

/* ---------- 参考图 ---------- */
const drop = $("#drop"), fileInput = $("#file");
drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("hot"); };
drop.ondragleave = () => drop.classList.remove("hot");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("hot"); addFiles(e.dataTransfer.files); };
fileInput.onchange = e => { addFiles(e.target.files); fileInput.value = ""; };
document.addEventListener("paste", e => {
  if(state.mode !== "edit") return;
  const items = [...(e.clipboardData?.items || [])].filter(i=>i.type.startsWith("image/"));
  if(items.length){ e.preventDefault(); addFiles(items.map(i=>i.getAsFile()).filter(Boolean)); }
});
function addFiles(list){
  [...list].forEach(f=>{
    if(!f || !f.type.startsWith("image/")) return;
    if(state.refs.length >= 16) return;
    const fr = new FileReader();
    fr.onload = () => { state.refs.push({ name: f.name || "paste.png", data: fr.result }); renderRefs(); };
    fr.readAsDataURL(f);
  });
}
function renderRefs(){
  $("#refs").innerHTML = state.refs.map((r,i)=>
    `<div class="ref"><img src="${r.data}"><button data-i="${i}">×</button></div>`).join("");
  $("#refs").querySelectorAll("button").forEach(b=>{
    b.onclick = () => { state.refs.splice(+b.dataset.i,1); renderRefs(); };
  });
}

/* ---------- 生成 ---------- */
function showErr(msg){ const e = $("#err"); e.textContent = msg; e.style.display = "block"; }
function hideErr(){ $("#err").style.display = "none"; }

$("#run").onclick = run;
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); run(); }
});

async function run(){
  if(state.busy) return;
  const prompt = $("#prompt").value.trim();
  if(!prompt){ showErr("提示词不能为空"); return; }
  if(state.mode === "edit" && !state.refs.length){ showErr("参考图编辑至少要给一张图"); return; }
  hideErr(); setBusy(true);

  let size = $("#size").value;
  if(size === "custom"){
    const w = parseInt($("#cw").value || "0", 10), h = parseInt($("#ch").value || "0", 10);
    if(!(w >= 256 && h >= 256)){ showErr("自定义宽高至少 256×256"); setBusy(false); return; }
    size = w + "x" + h;
  }
  const payload = {
    prompt,
    size,
    quality: $("#quality").value,
    background: $("#background").value || null,
    response_format: $("#response_format").value,
  };
  if(state.mode === "edit"){
    payload.images = state.refs;
    payload.input_fidelity = $("#fidelity").value;
  }
  try{
    const r = await fetch(state.mode === "edit" ? "/api/edit" : "/api/generate", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
    }).then(r=>r.json());
    if(!r.ok){ showErr(r.error || "调用失败"); return; }
    showResult(r);
    await loadHistory();
  }catch(err){
    showErr("请求异常：" + err.message);
  }finally{ setBusy(false); }
}

function setBusy(on){
  state.busy = on;
  const btn = $("#run");
  btn.disabled = on;
  if(on){
    state.t0 = Date.now();
    $("#canvas").innerHTML = `<div style="text-align:center"><div class="spin"></div>
      <div style="font-size:13px;color:var(--ink-2)">正在生成…</div>
      <div id="clock" style="font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px">0.0s</div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:4px">通常 20–45 秒</div></div>`;
    state.timer = setInterval(()=>{
      const el = $("#clock"); if(el) el.textContent = ((Date.now()-state.t0)/1000).toFixed(1) + "s";
    }, 100);
  }else{
    clearInterval(state.timer);
  }
}

function showResult(r){
  state.current = r;
  $("#canvas").innerHTML = `<img src="${r.url}?t=${Date.now()}">`;
  const u = r.usage || {};
  $("#meta").style.display = "flex";
  $("#meta").innerHTML = `
    <span class="k">耗时 <b>${r.elapsed}s</b></span>
    <span class="k">输出 token <b>${(u.output_tokens||0)}</b></span>
    <span class="k">${$("#size").value} · ${$("#quality").value}</span>
    <span class="k">${r.file}</span>
    <span class="actions">
      <a href="${r.url}?dl=1" download>下载</a>
      <button onclick="copyPath('${r.file}')">复制文件名</button>
    </span>`;
}
function copyPath(name){ navigator.clipboard.writeText(name); }

async function loadHistory(){
  const r = await fetch("/api/history").then(r=>r.json());
  const items = r.items || [];
  $("#histCount").textContent = items.length;
  $("#hist").innerHTML = items.map(it=>`
    <div class="thumb" data-url="${it.url}" data-name="${it.name}">
      <img loading="lazy" src="${it.url}">
      <button class="del" data-name="${it.name}">删</button>
    </div>`).join("");
  if(items.length && !state.current){
    const f = items[0];
    $("#canvas").innerHTML = `<img src="${f.url}" alt="">`;
    $("#meta").style.display = "flex";
    $("#meta").innerHTML = `<span class="k">最近一张 <b>${(f.meta||{}).quality || ""}</b></span><span class="k">${f.name}</span>`;
  }
  $("#hist").querySelectorAll(".thumb").forEach(t=>{
    t.onclick = (e)=>{
      if(e.target.classList.contains("del")) return;
      $("#canvas").innerHTML = `<img src="${t.dataset.url}">`;
      $("#meta").style.display = "flex";
      $("#meta").innerHTML = `<span class="k">${t.dataset.name}</span>`;
    };
  });
  $("#hist").querySelectorAll(".del").forEach(b=>{
    b.onclick = async (e)=>{
      e.stopPropagation();
      await fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:b.dataset.name})});
      loadHistory();
    };
  });
}

$("#btnFolder").onclick = () => fetch("/api/open-folder",{method:"POST"}).then(()=>{});

syncPlaceholder(); loadConfig(); loadHistory();
</script>
</body>
</html>
